lynix:
  schema_version: 1
  masking:
    enabled: true
    # mask_request_headers: true
    # mask_request_body: true
    # mask_response_headers: true
    # mask_response_body: true
    # mask_query_params: true
    # mask_cli_output: false
    # fail_on_detected_secret: false
    # rules:
    #   - pattern: ssn
    #     scope: all
    #   - pattern: x-internal
    #     scope: header
  defaults:
    env: dev
  paths:
    collections_dir: collections
    environments_dir: env
    runs_dir: runs
  artifacts:
    save_response_headers: true
    save_response_body: false  # default is true; kept off here to slim artifacts
  # run:
  #   timeout_seconds: 300     # whole-run deadline
  #   retries: 0               # retries for transient errors
  #   retry_delay_ms: 0
  #   retry_5xx: false
  #   cookies: false           # in-memory cookie jar (session-based auth)
  #   max_body_kb: 256         # response body cap
  #   tls:
  #     ca_file: certs/ca.pem  # extra trusted CAs (instead of insecure)
