name: 'Lynix API Testing'
description: 'Run API tests with Lynix — declarative HTTP testing for CI/CD pipelines'
branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  collection:
    description: 'Collection name or path'
    required: true
  environment:
    description: 'Environment name or path'
    required: false
  workspace:
    description: 'Workspace root directory'
    required: false
    default: '.'
  format:
    description: 'Output format (pretty or json)'
    required: false
    default: 'pretty'
  report:
    description: 'Report type (e.g., junit)'
    required: false
  report-path:
    description: 'Path to write the report file'
    required: false
  fail-fast:
    description: 'Stop on first failure'
    required: false
    default: 'false'
  tags:
    description: 'Run only requests with matching tags'
    required: false
  only:
    description: 'Run only named requests'
    required: false
  no-save:
    description: 'Skip saving run artifacts'
    required: false
    default: 'true'
  version:
    description: 'Lynix version to install'
    required: false
    default: 'latest'
  retries:
    description: 'Number of retries for transient errors'
    required: false
  retry-delay:
    description: 'Delay between retries in ms'
    required: false
  retry-5xx:
    description: 'Also retry on 5xx responses'
    required: false
    default: 'false'
  parallel:
    description: 'Run independent requests in parallel'
    required: false
    default: 'false'
  insecure:
    description: 'Skip TLS verification'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    # Inputs are passed exclusively through env vars and quoted argument
    # arrays: interpolating ${{ }} into bash with eval allows command
    # injection from any input value.
    - name: Install Lynix
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        if [ "$INPUT_VERSION" != "latest" ]; then
          export LYNIX_VERSION="$INPUT_VERSION"
        fi
        # The action ships its own installer: no fetch from a mutable branch.
        sh "${{ github.action_path }}/install.sh"
        echo "/usr/local/bin" >> "$GITHUB_PATH"

    - name: Run API tests
      shell: bash
      env:
        INPUT_COLLECTION: ${{ inputs.collection }}
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
        INPUT_WORKSPACE: ${{ inputs.workspace }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_REPORT: ${{ inputs.report }}
        INPUT_REPORT_PATH: ${{ inputs.report-path }}
        INPUT_FAIL_FAST: ${{ inputs.fail-fast }}
        INPUT_TAGS: ${{ inputs.tags }}
        INPUT_ONLY: ${{ inputs.only }}
        INPUT_NO_SAVE: ${{ inputs.no-save }}
        INPUT_RETRIES: ${{ inputs.retries }}
        INPUT_RETRY_DELAY: ${{ inputs.retry-delay }}
        INPUT_RETRY_5XX: ${{ inputs.retry-5xx }}
        INPUT_PARALLEL: ${{ inputs.parallel }}
        INPUT_INSECURE: ${{ inputs.insecure }}
      run: |
        args=(run -c "$INPUT_COLLECTION")

        [ -n "$INPUT_ENVIRONMENT" ] && args+=(-e "$INPUT_ENVIRONMENT")
        [ "$INPUT_WORKSPACE" != "." ] && args+=(-w "$INPUT_WORKSPACE")
        [ "$INPUT_FORMAT" != "pretty" ] && args+=(--format "$INPUT_FORMAT")
        [ -n "$INPUT_REPORT" ] && args+=(--report "$INPUT_REPORT")
        [ -n "$INPUT_REPORT_PATH" ] && args+=(--report-path "$INPUT_REPORT_PATH")
        [ "$INPUT_FAIL_FAST" = "true" ] && args+=(--fail-fast)
        [ -n "$INPUT_TAGS" ] && args+=(--tags "$INPUT_TAGS")
        [ -n "$INPUT_ONLY" ] && args+=(--only "$INPUT_ONLY")
        [ "$INPUT_NO_SAVE" = "true" ] && args+=(--no-save)
        [ -n "$INPUT_RETRIES" ] && args+=(--retries "$INPUT_RETRIES")
        [ -n "$INPUT_RETRY_DELAY" ] && args+=(--retry-delay "$INPUT_RETRY_DELAY")
        [ "$INPUT_RETRY_5XX" = "true" ] && args+=(--retry-5xx)
        [ "$INPUT_PARALLEL" = "true" ] && args+=(--parallel)
        [ "$INPUT_INSECURE" = "true" ] && args+=(--insecure)

        echo "Running: lynix ${args[*]}"
        lynix "${args[@]}"
