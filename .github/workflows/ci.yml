name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.25"]
        include:
          - os: ubuntu-latest
            go: "1.26"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Tidy check
        if: runner.os == 'Linux'
        run: |
          go mod tidy
          git diff --exit-code

      - name: Tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        if: runner.os == 'Linux'
        run: go tool cover -func=coverage.out

      - name: Coverage threshold check
        if: runner.os == 'Linux'
        shell: bash
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | awk '/^total:/ {sub(/%/, "", $3); print $3}')
          THRESHOLD=70
          echo "Total coverage: ${COVERAGE}% (threshold: ${THRESHOLD}%)"
          awk -v c="$COVERAGE" -v t="$THRESHOLD" 'BEGIN { exit (c >= t) ? 0 : 1 }' || {
            echo "::error::Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          }

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # make lint compiles golangci-lint with the repo's Go toolchain, so the
      # linter version and the language version can never drift apart.
      - name: Lint
        run: make lint

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: govulncheck
        run: make vulncheck

  examples:
    name: Examples (E2E smoke)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build binary
        run: make build

      # Runs every bundled example against its real public API with the
      # compiled binary — the same first commands a new user would try.
      - name: Run examples
        run: |
          for ex in health-check rest-crud auth-chain; do
            echo "::group::${ex}"
            ./bin/lynix run -c "examples/${ex}/collection.yaml" -e "examples/${ex}/env.yaml" --no-save
            echo "::endgroup::"
          done

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -ldflags "-X github.com/aalvaropc/lynix/internal/buildinfo.Version=ci -X github.com/aalvaropc/lynix/internal/buildinfo.Commit=${{ github.sha }} -X github.com/aalvaropc/lynix/internal/buildinfo.Date=ci" -o /dev/null ./cmd/lynix
