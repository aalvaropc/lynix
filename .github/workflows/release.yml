name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      # The v0.2.0 release shipped while the tap silently stayed at v0.1.0.
      # Verify the formula actually reached the released version.
      - name: Verify Homebrew tap was updated
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for i in 1 2 3; do
            FORMULA=$(curl -sSfL "https://raw.githubusercontent.com/aalvaropc/homebrew-tap/main/Formula/lynix.rb" || true)
            if echo "$FORMULA" | grep -q "$VERSION"; then
              echo "Tap is at ${VERSION}."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Homebrew tap was not updated to ${VERSION}"
          exit 1
